spec_version: 1
id: config
purpose: >-
  Specify how the todo.sh configuration locates task data, add-ons, hooks, and
  output processing, and which plugin defaults shape the overview and schedule
  actions. This records the configuration as it exists in the repository today.
requirements:
  - id: config-data-and-plugin-paths
    when: >-
      todo.sh sources ~/.todo/config at startup.
    then: >-
      TODO_DIR is the absolute path $HOME/Sync/Todo; TODO_FILE, DONE_FILE, and
      REPORT_FILE resolve beneath it as todo.txt, done.txt, and report.txt;
      TODO_ACTIONS_DIR is $HOME/.todo/actions and TODO_HOOKS_DIR is
      $HOME/.todo/hooks. Every one of these variables is exported.
  - id: config-list-sort
    when: >-
      TODOTXT_SORT_COMMAND processes numbered list lines before colorization.
    then: >-
      Each line is prefixed with its first t:YYYY-MM-DD value, using the sort
      key 9999-99-99 when no threshold is present, and with its priority
      ((A) through (Z), or ~ when absent). Lines are stably sorted by threshold
      and then priority using LC_ALL=C, and the prefixes are removed. Open
      question: README.md and AGENTS.md instead describe undated lines sorting
      first with key 0000-00-00; the current code does the opposite.
  - id: config-final-filter
    when: >-
      A list is about to be displayed and todo.sh was not run with -x.
    then: >-
      TODOTXT_FINAL_FILTER runs the executable ~/.todo/filters/futureTasks,
      which removes lines carrying a future t: threshold. With -x the filter is
      bypassed and those lines are shown.
  - id: config-default-action
    when: >-
      todo.sh is invoked with no action argument.
    then: >-
      TODOTXT_DEFAULT_ACTION makes the overview action run.
  - id: config-plugin-defaults
    when: >-
      overview and schedule read their plugin settings from the environment.
    then: >-
      TODO_OVERVIEW_VIEWS is the ordered comma-separated list "ls @Routine:daily,
      ls @Routine:weekly, ls @Routine:monthly, today, ls due, schedule";
      TODO_OVERVIEW_SHOW_REMAINING_TASKS=true;
      TODO_OVERVIEW_DUPLICATE_TASKS=false; and
      TODO_SCHEDULE_PRIORITY_RESCHEDULE_ALL=false.
  - id: config-priority-colors
    when: >-
      todo.sh colorizes priority markers in list output.
    then: >-
      PRI_A, PRI_B, PRI_C, PRI_D, PRI_E, and PRI_W are exported from the color
      map as PINK, YELLOW, GREEN, LIGHT_BLUE, WHITE, and LIGHT_GREY, and DEFAULT
      is the ANSI reset code. Optional overrides for done tasks, projects,
      contexts, dates, numbers, and metadata remain commented out.
acceptance:
  - id: config-future-threshold-hidden-unless-x
    given: >-
      TODO_FILE contains one task with a threshold of tomorrow and one task
      with no threshold.
    when: >-
      todo.sh list is run once without -x and once with -x.
    then: >-
      The future task appears only in the -x output, while the undated task
      appears in both.
  - id: config-undated-sorts-after-dated
    given: >-
      TODO_FILE contains one task with t:today and one task with no threshold.
    when: >-
      todo.sh list output is inspected for line order.
    then: >-
      The dated task is listed first because the undated task receives sort key
      9999-99-99, which contradicts the documentation claim that undated lines
      sort first; the conflict remains an open question.
  - id: config-default-action-is-overview
    given: >-
      No action argument is supplied to todo.sh.
    when: >-
      todo.sh is invoked by itself.
    then: >-
      Output begins with the overview action's section headers rather than a
      plain task list.
