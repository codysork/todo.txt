spec_version: 1
id: predict
purpose: >-
  Specify the predict action, which now takes a mandatory mode as its first
  argument after the action name. The first mode, target, contains the existing
  forecasting behavior: it summarizes one arbitrary numeric metadata key from
  completed tasks in done.txt and estimates the chance of maintaining a chosen
  daily average over calendar horizons using mandatory Monte Carlo simulation,
  never a closed-form formula or a single historical path. A second mode,
  baseline, reports the highest daily value that can be met with 100 percent
  probability every day. A third mode, recovery, estimates the most likely
  number of days for the running daily average to return to the historical mean
  after a day reaching a supplied value, or after the highest observed day when
  no day reaches the value. In recovery, "baseline" means the historical mean
  rather than the baseline-mode minimum. This is target state: the current
  implementation still parses predict KEY [value] with no modes, so none of the
  mode contracts below are implemented yet, and the target-mode report still
  uses the "Target effort" heading instead of the "Target value" heading
  specified below.
requirements:
  - id: predict-cli
    when: >-
      predict is invoked with help, -h, or --help, with no mode, or with more
      than three arguments after the action name.
    then: >-
      Help aliases are checked before mode validation, as the first argument
      after the action name: help, -h, or --help prints help and exits 0. With
      no arguments after the action name, a missing mode prints "Error: Usage:
      todo.sh predict <mode> KEY [value] (name a mode such as target, baseline,
      or recovery)." on stderr and exits 1; a fourth argument prints a
      too-many-arguments error and exits 1. A leading "predict" argument passed
      by todo.sh is stripped before parsing.
  - id: predict-modes
    when: >-
      A first argument is supplied after the action name.
    then: >-
      Except for the help aliases checked before mode validation, that argument
      is always interpreted as the mode, even when it is the only argument; the
      mode is mandatory and positional. Three modes are defined: target runs
      the Monte Carlo forecasting behavior specified by the remaining
      requirements, baseline reports the highest guaranteed daily value, and
      recovery estimates the most likely days to return to the historical mean
      after a day at a supplied value. Any other first argument is an unknown
      mode, rejected with a usage error on stderr and exit status 1, and the
      error names target, baseline, and recovery as valid modes.
  - id: predict-baseline-mode
    when: >-
      predict baseline is invoked with a metadata key and no third argument.
    then: >-
      The action computes the highest daily value that can be met with 100
      percent probability every day: the minimum of the valid daily values
      aggregated for that key from done.txt. At that pace the target-mode Monte
      Carlo model reports 100.0 percent at every horizon; displayed percentages
      are rounded rather than exact probabilities. It prints a single line
      "Baseline: <N.NN> <key>/day" and no forecast table, then exits 0; the
      printed value is rounded to two decimals. A third argument is a usage
      error with exit status 1.
  - id: predict-baseline-data-rules
    when: >-
      Baseline mode reads completion records for the selected key.
    then: >-
      It applies the same key validation, record filtering, numeric validation,
      and per-date aggregation as target mode, keeping values for other keys
      separate and never inserting zero days for dates with no observation.
      An invalid key, unreadable done file, or key with no valid observations
      produces the same error and exit status as target mode.
  - id: predict-recovery-mode
    when: >-
      predict recovery is invoked with a metadata key and a numeric value.
    then: >-
      A supplied value at or below the historical mean short-circuits to zero
      recovery days, printed as "Recovery: 0 days", without selecting a
      starting day or running the simulation. Otherwise the action selects a
      starting historical day whose aggregated value is at least the supplied
      value, choosing the qualifying day closest to the supplied value and the
      earliest date on ties; when none qualifies it starts from the day with
      the highest observed value. It then draws following days from the same
      seeded moving-block bootstrap as target mode (20,000 paths, blocks of up
      to seven days) and measures, for each path, the first later day whose
      running average including the starting day is less than or equal to the
      historical mean. The reported result is the most frequent day count among
      paths that recover, using the smallest count on ties, printed as a single
      line "Recovery: <N> days" with no forecast table, and the action exits 0.
      If no path recovers within the Year horizon, it prints "Recovery: no
      recovery within <N> days."; this takes precedence over the "more than"
      wording below. When the supplied value is higher than the highest
      historical daily value and at least one path recovers, the calculated
      count is a lower bound of at least one day and the line reads "Recovery:
      more than <N> days" instead.
  - id: predict-recovery-data-rules
    when: >-
      Recovery mode reads completion records for the selected key.
    then: >-
      It applies the same key validation, record filtering, numeric validation,
      per-date aggregation, and error behavior as target mode, keeps values for
      other keys separate, and never inserts zero days for dates without an
      observation. A missing value argument, a non-finite value, an invalid key,
      an unreadable done file, or a key with no valid observations is an error
      with exit status 1. Repeated runs with identical input produce identical
      output.
  - id: predict-key-validation
    when: >-
      A metadata key is supplied.
    then: >-
      Any arbitrary token matching ^[A-Za-z][A-Za-z0-9_-]*$ is accepted; there
      is no built-in allowlist and no key is privileged, including effort.
      Matching is exact against token names in done.txt. A key outside the
      pattern prints "Error: Invalid metadata key: <key>" on stderr and exits
      1. DONE_FILE comes from the environment or from TODO_DIR/done.txt and
      must be a readable file.
  - id: predict-record-filtering
    when: >-
      A line of DONE_FILE is examined for the selected key.
    then: >-
      It is used only when it starts with "x ", has a valid ISO completion date
      on or before today, and contains the exact key. Dates with no valid
      selected-key observation are not included as zero days, and values for
      other keys are never merged into the selected key's history.
  - id: predict-value-validation
    when: >-
      A candidate value for the selected key is parsed.
    then: >-
      Date-shaped values and nonnumeric text are skipped; signed, decimal,
      leading-decimal, and exponent forms are accepted. A repeated selected key
      on one record, a numeric-looking malformed value, NaN, or infinity causes
      a specific error on stderr and exit status 1. Valid values from multiple
      records on the same completion date are summed.
  - id: predict-history-statistics
    when: >-
      At least one valid observation exists for the key.
    then: >-
      The report shows the selected key, the arithmetic mean over observed
      days, the median, the population standard deviation, the percentage of
      observed days with value zero, and the number of observation days. With
      no valid observations the action reports no data and exits 1 rather than
      fabricating zero statistics.
  - id: predict-target-pace
    when: >-
      An optional third argument after the mode and key is supplied, or it is
      omitted.
    then: >-
      The argument must be a finite float or the action prints a target error
      and exits 1; without it the historical mean is the target. The report
      prints that target with two decimals as <key>/day.
  - id: predict-bootstrap-forecast
    when: >-
      A prediction report is produced; its probabilities MUST be derived from
      Monte Carlo simulation rather than a closed-form formula or a single
      historical path.
    then: >-
      Exactly 20,000 simulated paths are generated with a fixed seed of zero by
      resampling observed daily values in contiguous blocks of up to seven days
      with wraparound, so every historical day can start a block. The four
      horizons Day (1 day), Week (7 days), Month (calendar days in the current
      month), and Year (calendar days in the current year) share each simulated
      path. For each horizon, probability is the fraction of paths whose running
      total reaches the target pace multiplied by the elapsed day count, so
      extra value on one day can compensate for an earlier shortfall. Reported
      MC error is the binomial sampling error sqrt(p(1-p)/20,000), representing
      simulation noise only, and identical inputs produce identical
      probabilities and errors.
  - id: predict-report-content
    when: >-
      A successful report is printed.
    then: >-
      It contains a "Pace Maintainability Report" title, the statistics lines,
      a "Simulations: 20,000" line and a "Block size: N days" line where N is
      the smaller of seven and the observation count, a table headed "Period",
      "Target value", "P(maintain)", and "MC error" with one row per horizon,
      where "Target value" is the target pace multiplied by that horizon's day
      count, and interpretation notes about meeting the target total and MC
      error being sampling error only.
acceptance:
  - id: predict-key-isolated-statistics
    given: >-
      Completed records contain both focus and stress values on the same dates,
      with different magnitudes.
    when: >-
      todo.sh predict target focus is run.
    then: >-
      The report names focus as the selected key and its mean, median,
      deviation, zero frequency, and observation count are computed only from
      focus values.
  - id: predict-duplicate-key-rejected
    given: >-
      One completed record contains two focus: tokens.
    when: >-
      todo.sh predict target focus is run.
    then: >-
      Stderr reports a duplicate key on that line number and the exit status
      is 1.
  - id: predict-missing-key-reports-no-data
    given: >-
      DONE_FILE has valid completed records but none contain the selected key.
    when: >-
      todo.sh predict target missing is run.
    then: >-
      Stderr reports no data for that key and the exit status is 1.
  - id: predict-explicit-target
    given: >-
      A valid focus history exists.
    when: >-
      todo.sh predict target focus 3.5 is run.
    then: >-
      The report shows a target pace of 3.50 focus/day and later row targets
      equal 3.5 multiplied by each horizon's day count.
  - id: predict-report-is-reproducible
    given: >-
      The same DONE_FILE contents and the same date.
    when: >-
      todo.sh predict target focus is run twice.
    then: >-
      Both reports are byte-for-byte identical, including all probabilities
      and MC errors.
  - id: predict-monte-carlo-is-observable
    given: >-
      A valid focus history exists.
    when: >-
      todo.sh predict target focus is run.
    then: >-
      The report states "Simulations: 20,000" and a block size no larger than
      seven days, and the P(maintain) column contains simulation-derived
      percentages for all four horizons.
  - id: predict-certain-and-impossible-targets
    given: >-
      A valid history exists and two runs use target paces at or below the
      smallest observation and above every observation, respectively.
    when: >-
      todo.sh predict target focus <low> and todo.sh predict target focus <high> are run.
    then: >-
      The low target reports 100.0% with 0.00 pp MC error for every horizon,
      and the high target reports 0.0% with 0.00 pp MC error for every horizon.
  - id: predict-short-history-supports-long-horizons
    given: >-
      DONE_FILE contains only one valid observation for the selected key.
    when: >-
      todo.sh predict target focus is run.
    then: >-
      All four horizon rows are printed, the reported block size is one day,
      and repeated runs remain byte-for-byte identical.
  - id: predict-arbitrary-key-accepted
    given: >-
      DONE_FILE contains valid completed records with a custom key such as
      physical-exertion and no records with focus.
    when: >-
      todo.sh predict target physical-exertion is run.
    then: >-
      The action exits 0, the report names physical-exertion as the selected
      key, and its statistics come only from that key's values.
  - id: predict-target-mode-runs-forecast
    given: >-
      A valid history exists for an arbitrary key and the target mode is named.
    when: >-
      todo.sh predict target focus is run.
    then: >-
      The full Pace Maintainability Report is printed, including history
      statistics, Monte Carlo horizons, and MC errors.
  - id: predict-mode-is-required
    given: >-
      A valid history exists but no argument follows the action name.
    when: >-
      todo.sh predict is run.
    then: >-
      Stderr reports that a mode such as target is required and the exit
      status is 1; no report is printed.
  - id: predict-unknown-mode-rejected
    given: >-
      A valid history exists.
    when: >-
      todo.sh predict bogus is run.
    then: >-
      Stderr reports that bogus is not a known mode and names target, baseline,
      and recovery as valid, and the exit status is 1.

  # AI-generated documentation (not reviewed by a human)
  - id: predict-help-alias-precedence
    given: >-
      A valid history exists.
    when: >-
      todo.sh predict help is run.
    then: >-
      Help is printed and the exit status is 0, not an unknown-mode error.
  - id: predict-recovery-reports-modal-days
    given: >-
      A valid history exists, its mean is M, a supplied value above M is
      reached by at least one historical day, and at least one simulated path
      recovers within the Year horizon.
    when: >-
      todo.sh predict recovery focus <value> is run.
    then: >-
      A single "Recovery: <N> days" line is printed, where N is the most
      frequent simulated first later day at which the running average is at
      most M.
  - id: predict-recovery-falls-back-to-max-day
    given: >-
      The supplied value exceeds every historical daily value for focus, and at
      least one simulated path recovers within the Year horizon.
    when: >-
      todo.sh predict recovery focus <value> is run.
    then: >-
      The action exits 0 and reports "Recovery: more than <N> days" based on
      the highest observed day rather than an error.

  # AI-generated documentation (not reviewed by a human)
  - id: predict-recovery-max-value-needs-at-least-one-day
    given: >-
      The supplied value exceeds every historical daily value for focus, so the
      highest observed day is used as the starting day, and at least one
      simulated path recovers within the Year horizon.
    when: >-
      todo.sh predict recovery focus <value> is run.
    then: >-
      The output is "Recovery: more than <N> days" where N is at least 1.

  # AI-generated documentation (not reviewed by a human)
  - id: predict-recovery-no-recovery-wins-over-more-than
    given: >-
      The supplied value exceeds every historical daily value for focus, and no
      simulated path recovers within the Year horizon.
    when: >-
      todo.sh predict recovery focus <value> is run.
    then: >-
      The output is "Recovery: no recovery within <N> days." and the exit
      status is 0, not "Recovery: more than <N> days".

  # AI-generated documentation (not reviewed by a human)
  - id: predict-recovery-at-or-below-mean-is-zero
    given: >-
      The historical mean for focus is M and the supplied value is at or below
      M.
    when: >-
      todo.sh predict recovery focus M is run.
    then: >-
      The output is "Recovery: 0 days" and the exit status is 0.
  - id: predict-recovery-key-isolation
    given: >-
      Records contain focus values and different stress values, and no valid
      observation for missing.
    when: >-
      todo.sh predict recovery focus 5 and todo.sh predict recovery missing 5
      are run.
    then: >-
      The recovery result is computed from focus history only, and the missing
      key reports no data with exit status 1.
  - id: predict-recovery-requires-value
    given: >-
      A valid history exists for focus.
    when: >-
      todo.sh predict recovery focus is run.
    then: >-
      Stderr reports a missing value usage error and the exit status is 1.
  - id: predict-recovery-is-deterministic
    given: >-
      The same DONE_FILE contents, key, and value.
    when: >-
      todo.sh predict recovery focus 5 is run twice.
    then: >-
      Both outputs are byte-for-byte identical.
  - id: predict-baseline-equals-minimum-day
    given: >-
      The valid daily values for focus are 2, 5, and 9.
    when: >-
      todo.sh predict baseline focus is run.
    then: >-
      The only report line is "Baseline: 2.00 focus/day", with no Pace
      Maintainability Report or horizon table.
  - id: predict-baseline-guarantees-every-horizon
    given: >-
      Baseline mode reports B for a key with valid daily values.
    when: >-
      todo.sh predict target <key> B is run.
    then: >-
      All four horizons report 100.0 percent P(maintain) (a rounded display)
      with 0.00 pp MC error.
  - id: predict-baseline-key-isolation
    given: >-
      Completed records contain focus values and higher stress values, and no
      valid observation exists for missing.
    when: >-
      todo.sh predict baseline focus and todo.sh predict baseline missing are
      run.
    then: >-
      The first baseline is computed from focus values only, and the second
      reports no data for missing with exit status 1.
  - id: predict-baseline-rejects-value-argument
    given: >-
      A valid history exists for focus.
    when: >-
      todo.sh predict baseline focus 3.5 is run.
    then: >-
      Stderr reports a usage error and the exit status is 1.
