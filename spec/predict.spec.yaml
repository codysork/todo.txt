spec_version: 1
id: predict
purpose: >-
  Specify the predict action, which summarizes one numeric metadata key from
  completed tasks in done.txt and estimates the chance of maintaining a chosen
  daily average over calendar horizons. Monte Carlo simulation is mandatory for
  the forecast: the report must not use a closed-form formula or a single
  historical path. The remaining requirements describe the action as currently
  implemented and tested.
requirements:
  - id: predict-cli
    when: >-
      predict is invoked with help, -h, or --help, with no key, or with more
      than two arguments.
    then: >-
      Help is printed and the action exits 0 for a help alias; a missing key
      prints "Error: Usage: todo.sh predict KEY (name one numeric metadata
      key)." on stderr and exits 1; a third argument prints a too-many-
      arguments error and exits 1. A leading "predict" argument passed by
      todo.sh is stripped before parsing.
  - id: predict-key-validation
    when: >-
      A metadata key is supplied.
    then: >-
      Any arbitrary token matching ^[A-Za-z][A-Za-z0-9_-]*$ is accepted; there
      is no built-in allowlist and no key is privileged, including effort.
      Matching is exact against token names in done.txt. A key outside the
      pattern prints "Error: Invalid metadata key: <key>" on stderr and exits
      1. DONE_FILE comes from the environment or from TODO_DIR/done.txt and
      must be a readable file.
  - id: predict-record-filtering
    when: >-
      A line of DONE_FILE is examined for the selected key.
    then: >-
      It is used only when it starts with "x ", has a valid ISO completion date
      on or before today, and contains the exact key. Dates with no valid
      selected-key observation are not included as zero days, and values for
      other keys are never merged into the selected key's history.
  - id: predict-value-validation
    when: >-
      A candidate value for the selected key is parsed.
    then: >-
      Date-shaped values and nonnumeric text are skipped; signed, decimal,
      leading-decimal, and exponent forms are accepted. A repeated selected key
      on one record, a numeric-looking malformed value, NaN, or infinity causes
      a specific error on stderr and exit status 1. Valid values from multiple
      records on the same completion date are summed.
  - id: predict-history-statistics
    when: >-
      At least one valid observation exists for the key.
    then: >-
      The report shows the selected key, the arithmetic mean over observed
      days, the median, the population standard deviation, the percentage of
      observed days with value zero, and the number of observation days. With
      no valid observations the action reports no data and exits 1 rather than
      fabricating zero statistics.
  - id: predict-target-pace
    when: >-
      An optional second argument is supplied, or it is omitted.
    then: >-
      The argument must be a finite float or the action prints a target error
      and exits 1; without it the historical mean is the target. The report
      prints that target with two decimals as <key>/day.
  - id: predict-bootstrap-forecast
    when: >-
      A prediction report is produced; its probabilities MUST be derived from
      Monte Carlo simulation rather than a closed-form formula or a single
      historical path.
    then: >-
      Exactly 20,000 simulated paths are generated with a fixed seed of zero by
      resampling observed daily values in contiguous blocks of up to seven days
      with wraparound, so every historical day can start a block. The four
      horizons Day (1 day), Week (7 days), Month (calendar days in the current
      month), and Year (calendar days in the current year) share each simulated
      path. For each horizon, probability is the fraction of paths whose running
      total reaches the target pace multiplied by the elapsed day count, so
      extra value on one day can compensate for an earlier shortfall. Reported
      MC error is the binomial sampling error sqrt(p(1-p)/20,000), representing
      simulation noise only, and identical inputs produce identical
      probabilities and errors.
  - id: predict-report-content
    when: >-
      A successful report is printed.
    then: >-
      It contains a "Pace Maintainability Report" title, the statistics lines,
      a "Simulations: 20,000" line and a "Block size: N days" line where N is
      the smaller of seven and the observation count, a table headed "Period",
      "Target value", "P(maintain)", and "MC error" with one row per horizon,
      and interpretation notes about meeting the target total and MC error
      being sampling error only.
acceptance:
  - id: predict-key-isolated-statistics
    given: >-
      Completed records contain both focus and stress values on the same dates,
      with different magnitudes.
    when: >-
      todo.sh predict focus is run.
    then: >-
      The report names focus as the selected key and its mean, median,
      deviation, zero frequency, and observation count are computed only from
      focus values.
  - id: predict-duplicate-key-rejected
    given: >-
      One completed record contains two focus: tokens.
    when: >-
      todo.sh predict focus is run.
    then: >-
      Stderr reports a duplicate key on that line number and the exit status
      is 1.
  - id: predict-missing-key-reports-no-data
    given: >-
      DONE_FILE has valid completed records but none contain the selected key.
    when: >-
      todo.sh predict missing is run.
    then: >-
      Stderr reports no data for that key and the exit status is 1.
  - id: predict-explicit-target
    given: >-
      A valid focus history exists.
    when: >-
      todo.sh predict focus 3.5 is run.
    then: >-
      The report shows a target pace of 3.50 focus/day and later row targets
      equal 3.5 multiplied by each horizon's day count.
  - id: predict-report-is-reproducible
    given: >-
      The same DONE_FILE contents and the same date.
    when: >-
      todo.sh predict focus is run twice.
    then: >-
      Both reports are byte-for-byte identical, including all probabilities
      and MC errors.
  - id: predict-monte-carlo-is-observable
    given: >-
      A valid focus history exists.
    when: >-
      todo.sh predict focus is run.
    then: >-
      The report states "Simulations: 20,000" and a block size no larger than
      seven days, and the P(maintain) column contains simulation-derived
      percentages for all four horizons.
  - id: predict-certain-and-impossible-targets
    given: >-
      A valid history exists and two runs use target paces at or below the
      smallest observation and above every observation, respectively.
    when: >-
      todo.sh predict focus <low> and todo.sh predict focus <high> are run.
    then: >-
      The low target reports 100.0% with 0.00 pp MC error for every horizon,
      and the high target reports 0.0% with 0.00 pp MC error for every horizon.
  - id: predict-short-history-supports-long-horizons
    given: >-
      DONE_FILE contains only one valid observation for the selected key.
    when: >-
      todo.sh predict focus is run.
    then: >-
      All four horizon rows are printed, the reported block size is one day,
      and repeated runs remain byte-for-byte identical.
  - id: predict-arbitrary-key-accepted
    given: >-
      DONE_FILE contains valid completed records with a custom key such as
      physical-exertion and no records with focus.
    when: >-
      todo.sh predict physical-exertion is run.
    then: >-
      The action exits 0, the report names physical-exertion as the selected
      key, and its statistics come only from that key's values.
